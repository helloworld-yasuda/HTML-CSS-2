<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>HTML & CSS 総合課題②</title>
    </head>
    <body>
        <div class="container">
            <div class="image">
                <header class="header">
                    <h1 class="head">情報ページ</h1>
                    <p class="subtext">シンプルで整ったデザインのページを作成します。</p>
                </header>
            </div>
            <div class="cards">
                <div class="card">
                    <h2 class="card-title">タイトル1</h2>
                    <p>これは最初の情報カードです。</p>
                </div>
                <div class="card">
                    <h2 class="card-title">タイトル2</h2>
                    <p>これは2番目の情報カードです。</p>
                </div>
                <div class="card">
                    <h2 class="card-title">タイトル3</h2>
                    <p>これは3番目の情報カードです。</p>
                </div>
            </div>
            <div class="table-section">
                <div class="section-title">
                    <h2 class="section-title">データ一覧</h2>
                </div>
                <table class="table">
                    <thead class="thead">
                        <tr class="tr">
                            <th class="th">項目</th>
                            <th class="th">説明</th>
                            <th class="th">データ</th>
                        </tr>
                    </thead>
                    <tbody class="tbody">
                        <tr class="tr">
                            <td class="td">項目1</td>
                            <td class="td">説明１</td>
                            <td class="td">データ1</td>
                        </tr>
                        <tr class="tr">
                            <td class="td">項目2</td>
                            <td class="td">説明２</td>
                            <td class="td">データ2</td>
                        </tr>
                        <tr class="tr">
                            <td class="td">項目3</td>
                            <td class="td">説明３</td>
                            <td class="td">データ3</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>

    </body>
</html>
